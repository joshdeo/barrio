<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Party Tray Menu | Barrio Kitchen &amp; Cafe</title>
<meta name="description" content="The full Barrio Kitchen & Cafe party tray menu with medium and large prices. Pancit, adobo, lechon kawali, desserts and more.">
<meta name="theme-color" content="#1B100A">
<link rel="stylesheet" href="css/site.css">
</head>
<body data-page="menu">

<section class="phead">
  <div class="layer ghost-word" data-speed=".16" style="top:62%" aria-hidden="true">MENU</div>
  <div class="layer" data-speed=".3" style="right:10%;top:22%" aria-hidden="true"><div id="b1"></div></div>
  <div class="layer" data-speed=".5" style="right:26%;bottom:18%" aria-hidden="true"><div id="b2"></div></div>
  <span class="eyebrow rv in">Party Tray Menu</span>
  <h1 data-chars style="--d:.4s">Everything on <em>the table.</em></h1>
  <p class="rv in" style="--d:.9s">Medium and large trays, priced plainly. Order at least 2 to 3 days in advance by phone or email.</p>
</section>

<div class="menu-tools">
 <div class="bar">
  <div class="wrap">
    <div class="chips" id="chips"></div>
    <div class="controls">
      <div class="toggle" id="size"><button data-s="" class="on">Both</button><button data-s="m">M</button><button data-s="l">L</button></div>
      <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" placeholder="Search dishes" aria-label="Search dishes"></label>
    </div>
  </div>
 </div>
</div>
<div class="menu-spacer"></div>

<main class="wrap" id="menu"></main>
<div class="wrap"><div class="noresult" id="none"><h3 class="serif" style="font-size:2.4rem;margin-bottom:10px">Nothing matches that.</h3><p>Try another word, or call us and ask about it.</p></div></div>

<div class="wrap" style="padding-bottom:120px">
  <div class="notice rv">
    <div class="layer" style="position:absolute;right:-40px;top:-30px;opacity:.12;width:260px" aria-hidden="true"><div id="nm"></div></div>
    <h3>Ready to order? Build your tray and send it over.</h3>
    <div style="display:flex;gap:14px;flex-wrap:wrap;position:relative">
      <a href="trays.html" class="btn solid">Build a tray</a>
      <a href="tel:+19055920079" class="btn ghost">905 592 0079</a>
    </div>
  </div>
</div>

<div data-footer></div>

<script src="js/menu-data.js"></script>
<script src="js/site.js"></script>
<script>
(function(){
  var B=BARRIO, U=BarrioUI;
  document.getElementById("b1").innerHTML=U.bean("--s:60px;--o:.55;--r:-20deg");
  document.getElementById("b2").innerHTML=U.bean("--s:34px;--o:.45;--r:30deg;--d:-2s");
  document.getElementById("nm").innerHTML=U.mark({anim:false});
  function price(v){var w=Math.floor(v),c=Math.round((v-w)*100);return "<sup>$</sup>"+w+(c?"."+String(c).padStart(2,"0"):"")}
  var menu=document.getElementById("menu"), chips=document.getElementById("chips");
  menu.innerHTML=B.cats.map(function(c,ci){
    var rows=B.items.filter(function(x){return x.cat===c.id}).map(function(x){
      var pr,sub="";
      if(x.m){
        pr="<div class='price m'><i>"+(x.mLabel||"M")+"</i><b>"+price(x.m)+"</b></div><div class='price l'><i>"+(x.lLabel||"L")+"</i><b>"+price(x.l)+"</b></div>";
        if(x.note)sub=x.note;
      }else{
        pr="<div class='price'><i>"+(x.unit||"")+"</i><b>"+price(x.each)+"</b></div>";
        if(x.unit==="each")sub="Priced per piece";
        if(x.unit==="pair")sub="Priced per pair";
        if(x.min)sub=sub+" . "+x.min+" pieces minimum";
        sub=sub.replace(/^ \. /,"").replace(" . ",", ");
      }
      return "<div class='mrow rv' data-name='"+x.name.toLowerCase()+"'><div><h3>"+x.name+"</h3>"+(sub?"<small>"+sub+"</small>":"")+"</div><div class='prices'>"+pr+"</div></div>";
    }).join("");
    return "<section class='mcat' id='"+c.id+"' data-cat><div class='mcat-head rv'><span class='no'>0"+(ci+1)+"</span><h2>"+c.name+"</h2><p>"+c.blurb+"</p></div>"+rows+"</section>";
  }).join("");
  chips.innerHTML=B.cats.map(function(c){return "<button class='chip' data-id='"+c.id+"'>"+c.name+"</button>"}).join("");
  BarrioWatch(menu);

  chips.addEventListener("click",function(e){var b=e.target.closest(".chip");if(!b)return;document.getElementById(b.dataset.id).scrollIntoView({behavior:"smooth"})});
  document.getElementById("size").addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b)return;
    this.querySelectorAll("button").forEach(function(x){x.classList.toggle("on",x===b)});
    menu.classList.remove("size-m","size-l");if(b.dataset.s)menu.classList.add("size-"+b.dataset.s);
  });
  var q=document.getElementById("q"),none=document.getElementById("none");
  q.addEventListener("input",function(){
    var t=q.value.trim().toLowerCase(),shown=0;
    menu.querySelectorAll("[data-cat]").forEach(function(s){
      var n=0;s.querySelectorAll(".mrow").forEach(function(r){var ok=!t||r.dataset.name.indexOf(t)>-1;r.style.display=ok?"":"none";if(ok){n++;r.classList.add("in")}});
      s.style.display=n?"":"none";shown+=n;
    });
    none.classList.toggle("show",!shown);
  });
  /* scrollspy */
  var spy=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){chips.querySelectorAll(".chip").forEach(function(c){var on=c.dataset.id===e.target.id;c.classList.toggle("on",on);if(on&&chips.scrollWidth>chips.clientWidth)chips.scrollTo({left:c.offsetLeft-40,behavior:"smooth"})})}})},{rootMargin:"-35% 0px -60% 0px"});
  menu.querySelectorAll("[data-cat]").forEach(function(s){spy.observe(s)});
  var tools=document.querySelector(".menu-tools"),ly=scrollY;
  addEventListener("scroll",function(){var y=scrollY;if(matchMedia("(max-width:640px)").matches){tools.classList.toggle("compact",y>ly&&y>260)}else tools.classList.remove("compact");ly=y},{passive:true});
  if(location.hash){setTimeout(function(){var el=document.querySelector(location.hash);if(el)el.scrollIntoView({behavior:"smooth"})},900)}
})();
</script>
</body>
</html>
